<!doctype html>
<html lang='en'>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='A Weather app'>
    <meta name='keywords' content='weather'>
    <meta content='Eldar Paşazadə' name='author'>
    <meta content='#0ea5e9' name='theme-color'>

    <meta property='og:title' content='Weather App'>
    <meta property='og:description' content='A Weather app'>
    <meta content='https://eldarlrd.is-a.dev/weather-app' property='og:url'>
    <meta property='og:image'
      content='https://repository-images.githubusercontent.com/719001057/2b5d46d6-a1c7-4602-a24b-cc37f9a9cca2'>

    <link href='/site.webmanifest' rel='manifest' type='application/manifest+json'>
    <link href='/favicon.png' rel='icon' sizes='512x512' type='image/png'>
    <script
      src='https://kit.fontawesome.com/0db9b2eb32.js'
      crossorigin='anonymous'></script>
    <title>Weather App</title>

    <style>
      @font-face {
        size-adjust: 110%;
        font-display: swap;
        font-family: 'Signika';
        src: url('src/assets/Signika.woff2') format('woff2');
      }

      :root {
        min-height: 100dvh;
        scrollbar-width: thin;
        scroll-behavior: smooth;
        --bg-primary: #0ea5e9;
        --bg-secondary: #7dd3fc;
        --bg-accent: #f59e0b;
        --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        background: center / cover no-repeat var(--bg-primary);
      }

      body {
        margin: 0;
        min-height: 100dvh;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        background-color: #0ea5e980;
        color: white;
      }
    </style>
  </head>

  <body>
    <lit-main></lit-main>
    <script type='module' src='src/main.ts'></script>
  </body>
